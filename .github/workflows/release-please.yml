name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org/'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Update npm for OIDC trusted publishing support
        run: npm install -g npm@latest
      - name: Build
        run: npm run build
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Sync jsr.json version with package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            const jsr = JSON.parse(fs.readFileSync('./jsr.json', 'utf8'));
            jsr.version = pkg.version;
            fs.writeFileSync('./jsr.json', JSON.stringify(jsr, null, 2) + '\n');
          "
      - name: Publish to JSR
        # Best-effort mirror alongside npm (the primary registry) -- a JSR
        # hiccup shouldn't fail the whole release workflow after npm has
        # already published successfully.
        run: npx jsr publish --allow-slow-types
        continue-on-error: true
