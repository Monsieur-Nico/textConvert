name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        # No `release-type` input here: when it's set, the action builds its
        # config from that input alone and ignores release-please-config.json.
        # The release type lives in the config file instead.
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 24's bundled npm (>= 11.5.1) supports OIDC trusted publishing, so
      # the release uses a known npm rather than whatever npm@latest is that day.
      # No dependency cache here on purpose: a release job shouldn't restore
      # anything another workflow could have written.
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org/'
      - name: Install dependencies
        run: npm ci
      # npm publish runs prepublishOnly (tests, then build) and prepack (build),
      # so there's no separate build step.
      # Authenticates through npm trusted publishing (OIDC): this workflow file
      # is registered as a trusted publisher for the package on npmjs.com, so
      # no token is passed in, and a misconfigured publisher fails here instead
      # of falling back to one. Trusted publishing can't change dist-tags, so
      # `next` is moved by hand after a stable release (see CONTRIBUTING.md).
      - name: Publish to npm
        run: npm publish --provenance --access public
      - name: Publish to JSR
        # Best-effort mirror alongside npm (the primary registry) -- a JSR
        # hiccup shouldn't fail the whole release workflow after npm has
        # already published successfully. release-please bumps jsr.json's
        # version in the release PR (extra-files in release-please-config.json),
        # and `npx` runs the jsr CLI pinned in package-lock.json.
        run: npx --no-install jsr publish
        continue-on-error: true
