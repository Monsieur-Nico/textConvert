name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: node
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Node 24's bundled npm (>= 11.5.1) supports OIDC trusted publishing, so
      # the release uses a known npm rather than whatever npm@latest is that day.
      # No dependency cache here on purpose: a release job shouldn't restore
      # anything another workflow could have written.
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org/'
      - name: Install dependencies
        run: npm ci
      # npm publish runs prepublishOnly (tests, then build) and prepack (build),
      # so there's no separate build step.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # npm never moves dist-tags on its own, so after a stable release `next`
      # would keep pointing at an older prerelease and `npm i <pkg>@next` would
      # install something behind `latest`. Point `next` at this release, unless
      # it already points at a newer prerelease line (say 4.0.0-next.N while
      # this release is 3.x), which publish-next.yml owns.
      - name: Keep the next tag at or ahead of latest
        # Best-effort like the JSR mirror below: the release itself has
        # already published, so a tag hiccup shouldn't fail the workflow.
        continue-on-error: true
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          NEXT=$(npm view "$NAME" dist-tags.next 2>/dev/null || true)
          # Exits 1 only when next's major.minor.patch is higher than this
          # release. A prerelease of the same core version sorts below the
          # release itself, so it gets moved too.
          if node -e '
            const core = (v) => (v || "0.0.0").split("-")[0].split(".").map(Number);
            const release = core(process.argv[1]);
            const next = core(process.argv[2]);
            const i = release.findIndex((n, k) => n !== next[k]);
            process.exit(i !== -1 && next[i] > release[i] ? 1 : 0);
          ' "$VERSION" "$NEXT"; then
            npm dist-tag add "$NAME@$VERSION" next
          else
            echo "next is $NEXT, ahead of $VERSION; leaving it."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Sync jsr.json version with package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            const jsr = JSON.parse(fs.readFileSync('./jsr.json', 'utf8'));
            jsr.version = pkg.version;
            fs.writeFileSync('./jsr.json', JSON.stringify(jsr, null, 2) + '\n');
          "
          # jsr publish refuses to run with uncommitted changes (a genuinely
          # useful check -- it guarantees what's published matches what's in
          # version control). Commit the version bump locally, in this
          # throwaway CI checkout, to satisfy that check honestly instead of
          # bypassing it with --allow-dirty. Nothing here is pushed back to
          # the repo -- jsr.json's version is resynced the same way on every
          # release, so there's nothing to keep.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          if ! git diff --quiet -- jsr.json; then
            git commit -am "chore: sync jsr.json version to $VERSION" --quiet
          fi
      - name: Publish to JSR
        # Best-effort mirror alongside npm (the primary registry) -- a JSR
        # hiccup shouldn't fail the whole release workflow after npm has
        # already published successfully.
        run: npx jsr publish
        continue-on-error: true
