name: CI

on:
  push:
    branches: [main, '*.x']
  pull_request:
    branches: [main, '*.x']

# A new push to a PR cancels that PR's run still in progress. Pushes to main
# and N.x branches always run to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Checks whose result doesn't depend on the Node version: run them once.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      # Audit only what ships: the package has no runtime dependencies, so dev
      # tooling advisories (often with no patched release yet) would otherwise
      # fail every PR regardless of its changes. Dev dependencies stay covered
      # by Dependabot.
      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Runs the full test suite once, with coverage and its thresholds.
      - name: Test with coverage
        run: npm run coverage
      - name: Upload coverage reports to Codecov
        # Once per run (the reports are the same on every Node version), and
        # only where the token is available: pushes and same-repo PRs.
        if: matrix.node-version == '24.x' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/
          flags: unittests
          # A Codecov outage shouldn't fail CI: the coverage thresholds in
          # vitest.config.ts already gate the build.
          fail_ci_if_error: false
          verbose: true
