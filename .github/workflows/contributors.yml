name: contributors

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  contributors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JoshuaKGoldberg/all-contributors-auto-action@v0.6.1
        with:
          ignored-logins: |
            -\[bot\]$
