name: contributors

on:
  push:
    branches: [main]

permissions:
  # Lets the action find this workflow's previous successful run, which its
  # default `since: auto` scans from (all-contributors-auto-action >= 0.7.0).
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  contributors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fails on repos with 300+ recent events: the underlying
      # all-contributors-for-repository lib over-paginates GitHub's events
      # endpoint. Fix is up but still a draft:
      # https://github.com/JoshuaKGoldberg/all-contributors-for-repository/pull/1292
      - uses: JoshuaKGoldberg/all-contributors-auto-action@v0.7.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ignored-logins: |
            -\[bot\]$
