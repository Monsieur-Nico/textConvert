name: publish-next

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-next:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 24's bundled npm (>= 11.5.1) supports OIDC trusted publishing, so
      # the publish uses a known npm rather than whatever npm@latest is that day.
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org/'
      - name: Install dependencies
        run: npm ci
      - name: Compute a throwaway prerelease version
        id: version
        run: |
          CURRENT_MAJOR=$(node -p "require('./package.json').version.split('.')[0]")
          NEXT_MAJOR=$((CURRENT_MAJOR + 1))
          VERSION="${NEXT_MAJOR}.0.0-next.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set the throwaway version
        # Local to this checkout only -- never committed or pushed, so it
        # can't interfere with release-please's own version manifest on
        # main. Whatever's currently on main when this is triggered gets
        # published under this one-off version instead.
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version
      # npm publish runs prepublishOnly (tests, then build) and prepack (build),
      # so there's no separate build step.
      # Authenticates through npm trusted publishing (OIDC), like
      # release-please.yml: this workflow file is registered as a trusted
      # publisher on npmjs.com, so no token is passed in.
      - name: Publish to npm under the next tag
        run: npm publish --tag next --provenance --access public
      - name: Summary
        run: |
          echo "Published \`textconvert@${{ steps.version.outputs.version }}\` under the \`next\` tag." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Try it with: \`npm install textconvert@next\`" >> "$GITHUB_STEP_SUMMARY"
